[project]
name = "hawkeye-lite"
version = "0.1.0"
description = "Tennis court calibration, multi-view DLT 3D triangulation, and millimeter IN/OUT line calling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aryan Hood" }]
keywords = ["computer-vision", "tennis", "hawkeye", "homography", "3d-reconstruction", "kalman-filter", "line-calling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
]

[project.urls]
Repository = "https://github.com/aryanhood/hawkeye-lite"

[project.scripts]
hawkeye-lite = "evaluation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camera", "geometry", "vision", "tracking", "decision", "evaluation"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["camera", "geometry", "vision", "tracking", "decision", "evaluation", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "C4"]
ignore = [
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "N803",
    "N806",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["camera", "geometry", "vision", "tracking", "decision", "evaluation", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "scipy.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["camera", "geometry", "vision", "tracking", "decision", "evaluation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
